# Garmin CI: source checks that run on every push and pull request.
#
# The device compile and the simulator tests are not run here: they need the
# Connect IQ SDK and its per-device simulator data, which cannot be fetched
# without credentials this workflow deliberately does not hold. What remains
# is what the source can answer for on its own -- version consistency,
# packaged defaults, secret scanning, and per-file licensing. The full set,
# compile included, runs locally via dev/verify.sh.

name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version consistency (VERSION vs manifest.xml)
        # Needs neither Java nor the SDK, so it runs first — a mismatch
        # fails in seconds instead of after the SDK fetch + full compile.
        # VERSION is the human-facing release marker; manifest.xml's own
        # version="..." attribute is Connect IQ Store-submission metadata
        # (confirmed by testing: it does NOT get compiled into a sideloaded
        # .prg at all — rebuilding with/without it produces byte-identical
        # output). Keeping the two in sync here is what stops a release
        # from bumping one and forgetting the other.
        run: |
          version_file=$(tr -d '[:space:]' < VERSION)
          manifest_version=$(grep -oE 'version="[0-9]+\.[0-9]+\.[0-9]+"' manifest.xml | head -1 | tr -d 'version="')
          if [ -z "$version_file" ] || [ -z "$manifest_version" ]; then
            echo "::error::could not read VERSION or manifest.xml's version attribute"; exit 1
          fi
          if [ "$version_file" != "$manifest_version" ]; then
            echo "::error::VERSION ($version_file) and manifest.xml version= ($manifest_version) disagree"; exit 1
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # The SDK build and simulator tests are not run here -- see the note at
      # the top of this file. What remains are the checks the source can answer
      # for on its own; dev/verify.sh runs the full set.
      - name: properties.xml defaults (no baked-in test values)
        # dev/verify.sh runs the same check — duplicated here (not called
        # via verify.sh itself) so it's enforced on every PR, not only for
        # a contributor who remembers to run verify.sh locally first. Same
        # pattern as the version-consistency step above, which lives in
        # both places for the same reason.
        run: python3 dev/check_properties_defaults.py
      - name: Secret scan
        # Binary download rather than gitleaks-action: the org Actions policy
        # only allows GitHub-owned + verified-creator actions. sha256-verified
        # rather than piped straight into extraction.
        run: |
          set -euo pipefail
          v="$GITLEAKS_VERSION"
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          ./gitleaks git --no-banner .
      - name: REUSE lint (per-file SPDX licensing)
        # Python tool; the org Actions policy blocks fsfe/reuse-action, so run it
        # via pipx (preinstalled on the runner). The charset-normalizer extra
        # supplies reuse's encoding detection without needing libmagic.
        run: pipx run --spec 'reuse[charset-normalizer]' reuse lint
